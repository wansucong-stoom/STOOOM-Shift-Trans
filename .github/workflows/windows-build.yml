name: Windows build
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '사용자 시험용 GitHub prerelease를 게시합니다'
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Build TSF for x64 and x86
        shell: cmd
        run: native_tsf\build.cmd
      - name: Test TSF owned text stores and service lifecycle
        shell: cmd
        run: |
          call native_tsf\tests\run_host.cmd x64 || exit /b 1
          cd /d "%GITHUB_WORKSPACE%"
          call native_tsf\tests\run_host.cmd x86 || exit /b 1
      - run: python tests/run_tests.py
      - run: python -m PyInstaller --clean --noconfirm --onedir --windowed --version-file version_info.txt --icon stoom.ico --add-data "stoom.ico;." --name STOOMShiftTranslator --exclude-module spacy --exclude-module stanza --exclude-module torch --exclude-module argostranslate main.py
      - name: Build update installers
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 is required on this build image.' }
          $nativeVersion = "0.6.3-ci.$env:GITHUB_RUN_NUMBER"
          & $compiler "/DNativeBuildRoot=$PWD\native_tsf\build" "/DComponentVersion=$nativeVersion" native_tsf\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $compiler "/DTsfSetup=$PWD\native_tsf\dist\STOOM-TextService-$nativeVersion-setup.exe" installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: STOOMShiftTranslator-v069-keyboard-experimental
          path: dist/STOOM-Translator-v069-TSF-setup.exe
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: stoom-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: STOOMShiftTranslator-v069-keyboard-experimental
          path: release-files
      - name: Publish verified installer as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(python -c 'import release_updates; print(release_updates.VERSION)')
          tag="v$version"
          if [[ "$RELEASE_REF" == refs/tags/* && "$RELEASE_REF" != "refs/tags/$tag" ]]; then
            echo 'Tag must match the application version.' >&2
            exit 1
          fi
          installer="release-files/STOOM-Translator-v${version//./}-TSF-setup.exe"
          test -s "$installer"
          # Never replace an already published release or its installer.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; leaving its assets unchanged.'
            exit 0
          fi
          sha256sum "$installer" > release-files/SHA256SUMS.txt
          gh release create "$tag" "$installer" release-files/SHA256SUMS.txt --draft --prerelease --target "$RELEASE_COMMIT" --title "STOOM Shift Translator $version - testing" --generate-notes
          gh release edit "$tag" --draft=false --prerelease --latest=false
