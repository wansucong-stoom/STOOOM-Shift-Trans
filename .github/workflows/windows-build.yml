name: Windows build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python tests/run_tests.py
      - run: python -m PyInstaller --noconfirm --onefile --windowed --icon stoom.ico --add-data "stoom.ico;." --name STOOMShiftTranslator-v05 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: STOOMShiftTranslator-v05-experimental
          path: dist/STOOMShiftTranslator-v05.exe
