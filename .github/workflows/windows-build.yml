name: Windows build
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '사용자 시험용 GitHub prerelease를 게시합니다'
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python tests/run_tests.py
      - run: python -m PyInstaller --clean --noconfirm --onedir --windowed --version-file version_info.txt --icon stoom.ico --add-data "stoom.ico;." --add-data "branding/sst/lockup-light-3x.png;branding/sst" --add-data "branding/sst/stoom.ico;branding/sst" --add-data "branding/OFL-Inter.txt;branding" --name STOOMShiftTranslator --exclude-module spacy --exclude-module stanza --exclude-module torch --exclude-module argostranslate main.py
      - name: Build and verify MSI installer
        shell: pwsh
        run: |
          python build_msi.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = python -c 'import release_updates; print(release_updates.VERSION.replace(".", ""))'
          $msi = "dist/STOOM-Translator-v$version-TSF-setup.msi"
          python verify_msi.py $msi work/msi-verify
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $digest = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $([IO.Path]::GetFileName($msi))" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: STOOMShiftTranslator-msi
          path: |
            dist/STOOM-Translator-v*-TSF-setup.msi
            dist/SHA256SUMS.txt
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: stoom-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: STOOMShiftTranslator-msi
          path: release-files
      - name: Publish verified installer as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(python -c 'import release_updates; print(release_updates.VERSION)')
          tag="v$version"
          if [[ "$RELEASE_REF" == refs/tags/* && "$RELEASE_REF" != "refs/tags/$tag" ]]; then
            echo 'Tag must match the application version.' >&2
            exit 1
          fi
          installer="release-files/STOOM-Translator-v${version//./}-TSF-setup.msi"
          test -s "$installer"
          (cd release-files && sha256sum --check SHA256SUMS.txt)
          # Never replace an already published release or its installer.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; leaving its assets unchanged.'
            exit 0
          fi
          gh release create "$tag" "$installer" release-files/SHA256SUMS.txt --draft --prerelease --target "$RELEASE_COMMIT" --title "STOOM Shift Translator $version - testing" --generate-notes
          gh release edit "$tag" --draft=false --prerelease --latest=false
